name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source
        run: npm run check
      - name: Runtime and security tests
        run: npm test
      - name: Installer regression tests
        run: |
          python3 -m unittest discover -s test -p 'test_installer*.py'
          python3 -m unittest discover -s test -p 'test_bootstrap.py'
      - name: Fresh install, upgrade and rollback integration (isolated paths)
        run: python3 -m unittest discover -s test -p 'test_release_fresh.py'
      - name: Check both languages, local and streamed bootstrap (offline)
        run: |
          bash -n install.sh
          ./install.sh --mode fresh --dry-run --domain mcp.yourdomain.org --proxy caddy
          ./install.sh --lang en --mode fresh --dry-run --domain mcp.yourdomain.org --proxy caddy
      - name: Install plan (no root changes)
        run: |
          ./install.sh --dry-run --mode fresh --domain mcp.yourdomain.org --proxy caddy
          ./install.sh --dry-run --mode upgrade
